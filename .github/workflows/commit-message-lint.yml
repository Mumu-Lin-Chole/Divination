name: Commit Message Lint

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  commit-message-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            rev_range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            rev_range="$PUSH_HEAD_SHA^!"
          else
            rev_range="$PUSH_BEFORE_SHA..$PUSH_HEAD_SHA"
          fi

          dart divination_app/tool/commitlint.dart --rev-range "$rev_range"